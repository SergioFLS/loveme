name: Simple build script

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Run build script
      run: ./build.sh
    - uses: actions/upload-artifact@v7
      with:
        name: Package
        path: build/loveme-unobfuscated.jar
        archive: 'false'
